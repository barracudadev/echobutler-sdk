[package]
name = "echobutler-python"
description = "PyO3 native bindings for the EchoButler SDK — Mood, Stellar, and Social APIs, with asyncio support"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Must match the `module-name` leaf in pyproject.toml ([tool.maturin]).
name = "_echobutler"
crate-type = ["cdylib", "rlib"]

[dependencies]
echobutler-core = { path = "../echobutler-core" }
echobutler-stellar = { path = "../echobutler-stellar" }
pyo3 = { workspace = true, features = ["extension-module"] }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
tokio.workspace = true
serde_json.workspace = true
chrono.workspace = true

[package.metadata.maturin]
python-source = "python"
module-name = "echobutler._echobutler"
