[package]
name = "echobutler-ffi"
description = "EchoButler C-ABI FFI bindings — used by Flutter (dart:ffi) and other native integrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
echobutler-core = { path = "../echobutler-core" }
echobutler-stellar = { path = "../echobutler-stellar" }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
